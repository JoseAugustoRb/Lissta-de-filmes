<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Filmes</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #0f172a;
            color: #e5e7eb;
        }

        .navbar {
            background-color: #020617;
        }

        .movie-card {
    background: #1e1e1e;
    color: white;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    height: 100%;
}


        #movies-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        .movie-card:hover {
            transform: scale(1.03);
        }

        .rating {
            background-color: #16a34a;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .search-input {
            background-color: #020617;
            border: 1px solid #334155;
            color: #e5e7eb;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        footer {
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">🎬 MovieList</span>
    </div>
</nav>

<!-- Search -->
<div class="container mb-4">
    <input
        type="text"
        class="form-control search-input"
        placeholder="Buscar filme..."
    >
</div>

<!-- Movie List -->
<div class="container">
  <div class="row g-4" id="movies-row"></div>
</div>


<!-- Footer -->
<footer class="text-center mt-5 mb-4">
    © 2026 - Projeto de Estudo • Lista de Filmes
</footer>

    <script type="module" src="main.js"></script>
</body>
</html>
